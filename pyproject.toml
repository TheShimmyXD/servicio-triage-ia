[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "servicio-triage-ia"
version = "0.1.0"
description = "Microservicio REST que hace el triage de solicitudes de un BPO para varias empresas."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi~=0.163.1",
    "uvicorn~=0.54.0",
    "pydantic~=2.14.3",
    "pydantic-settings~=2.16.3",
    "httpx2~=2.16.2",
    "PyYAML~=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.2.0",
    "ruff~=0.17.5",
]

[tool.setuptools.packages.find]
include = ["domain*", "services*", "app*", "entrypoints*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.python-programmer]
type = "web"
