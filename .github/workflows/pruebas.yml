# Estilo y pruebas en cada cambio a main. Las pruebas no usan red ni la clave del LLM.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Estilo
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas
        run: pytest
