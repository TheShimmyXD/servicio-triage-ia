# Conjunto para medir la exactitud del triage (python -m evaluacion.medir_exactitud).
#
# Supuesto: los textos y las etiquetas los escribió una persona con el criterio del
# enunciado; no salen de clientes reales. Por empresa hay 8 solicitudes: las 4 categorías,
# 2 más redactadas sin las palabras clave de las reglas y 2 sin la información mínima.
#
# - categoria: la que asignaría un analista; null cuando falta información.
# - proximo_paso: CIERRE_POR_INFORMACION_INSUFICIENTE si falta información; si no, la
#   delegación de la categoría en el YAML de la empresa.

